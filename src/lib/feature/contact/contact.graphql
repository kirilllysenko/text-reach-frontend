query Contacts(
  $after: String
  $before: String
  $filter: ContactFilterInput
  $first: Int
  $last: Int
  $offset: Int
  $sortBy: [ContactSortByInput!]! = []
) @cache(policy: NetworkOnly) {
  contacts(
    after: $after
    before: $before
    filter: $filter
    first: $first
    last: $last
    offset: $offset
    sortBy: $sortBy
  ) {
    edges {
      node {
        birthday
        contactGroups {
          id
        }
        email
        firstName
        id
        lastName
        notes
        phoneNumber
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
    totalCount
  }
}

query CustomFields @cache(policy: CacheOrNetwork) {
  customFields {
    fieldType
    id
    name
    position
  }
}

mutation GenerateContactUploadUrl($filename: String!) {
  generateContactUploadUrl(filename: $filename) {
    newFilename
    url
  }
}

mutation ImportContacts($input: ContactImportInput!) {
  importContacts(input: $input) {
    contactImport {
      id
      importedRows
      status
    }
  }
}
