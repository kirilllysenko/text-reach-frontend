query PaymentOverview @cache(policy: NetworkOnly) {
  walletBalance {
    balanceUsdMicros
    currency
  }
}

query PaymentConfig @cache(policy: CacheOrNetwork) {
  paymentConfig {
    currency
    maxTopupUsdMicros
    minTopupUsdMicros
    stripePublishableKey
  }
}

query WalletTransactions(
  $after: String
  $before: String
  $filter: WalletTransactionFilterInput
  $first: Int
  $last: Int
  $offset: Int
  $sortBy: [WalletTransactionSortByInput!]! = []
) @cache(policy: NetworkOnly) {
  walletTransactions(
    after: $after
    before: $before
    filter: $filter
    first: $first
    last: $last
    offset: $offset
    sortBy: $sortBy
  ) {
    edges {
      node {
        amountUsdMicros
        createdAt
        currency
        entryType
        id
        source {
          __typename
          id
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
    totalCount
  }
}

mutation CreateTopupCheckoutSession($input: CreateTopupCheckoutSessionInput!) {
  createTopupCheckoutSession(input: $input) {
    amountUsdMicros
    clientSecret
    currency
    stripeAmountCents
    topup {
      id
      status
    }
  }
}
