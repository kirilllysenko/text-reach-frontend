query Conversations($after: String, $filter: ConversationFilterInput, $first: Int! = 50) {
  conversations(
    after: $after
    filter: $filter
    first: $first
    sortBy: [{ updatedAt: { direction: DESC } }, { id: { direction: DESC } }]
  ) {
    edges {
      cursor
      node {
        contact {
          firstName
          id
          lastName
          phoneNumber
        }
        contactPhoneNumber
        id
        lastMessage {
          createdAt
          direction
          id
          media {
            contentType
            url
          }
          status
          text
        }
        tenantPhoneNumber
        unreadCount
        updatedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
