query ContactImportJobs(
  $after: String
  $first: Int!
  $sortBy: [ContactImportSortInput!]! = [{ createdAt: { direction: DESC } }]
) @cache(policy: NetworkOnly) {
  contactImports(after: $after, first: $first, sortBy: $sortBy) {
    edges {
      node {
        createdAt
        filename
        id
        importedRows
        processedRows
        startedAt
        status
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
