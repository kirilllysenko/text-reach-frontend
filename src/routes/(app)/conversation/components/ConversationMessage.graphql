query ConversationMessage($id: Ulid!) @cache(policy: NetworkOnly) {
  message(id: $id) {
    campaign {
      id
      name
    }
    conversation {
      id
    }
    createdAt
    direction
    id
    media {
      contentType
      sizeBytes
      url
    }
    receivedAt
    sentAt
    status
    text
  }
}
