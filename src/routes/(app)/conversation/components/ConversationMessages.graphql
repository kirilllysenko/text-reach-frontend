query ConversationMessages($before: String, $filter: MessageFilterInput, $last: Int! = 100)
@cache(policy: NetworkOnly) {
  messages(
    before: $before
    filter: $filter
    last: $last
    sortBy: [{ createdAt: { direction: ASC } }, { id: { direction: ASC } }]
  ) {
    edges {
      cursor
      node {
        campaign {
          id
          name
        }
        createdAt
        direction
        id
        media {
          contentType
          sizeBytes
          url
        }
        receivedAt
        sentAt
        status
        text
      }
    }
    pageInfo {
      hasPreviousPage
      startCursor
    }
  }
}
