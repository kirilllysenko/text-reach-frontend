query Users($after: String, $first: Int, $sortBy: [TenantUserSortByInput!]! = []) {
  users(after: $after, first: $first, sortBy: $sortBy) {
    edges {
      node {
        id
        email
        name
        role
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount
  }
}
